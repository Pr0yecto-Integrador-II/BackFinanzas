name: backend

on:
  push:
    branches: [main]
    paths: ["backend/**", ".github/workflows/backend.yml"]
  pull_request:
    paths: ["backend/**", ".github/workflows/backend.yml"]

permissions:
  contents: read

jobs:
  checks:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: finanzas
          POSTGRES_PASSWORD: finanzas
          POSTGRES_DB: finanzas
        # Mismos puertos que docker-compose.yml: las pruebas los esperan.
        ports: ["5433:5432"]
        options: >-
          --health-cmd "pg_isready -U finanzas" --health-interval 5s --health-retries 10
      redis:
        image: redis:7
        ports: ["6380:6379"]
        options: >-
          --health-cmd "redis-cli ping" --health-interval 5s --health-retries 10
    env:
      JWT_SECRET: ${{ github.run_id }}-ci-only-secret-0123456789abcdef
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
      - run: uv sync --frozen
      - run: uv run ruff check .
      - run: uv run ruff format --check .
      - run: uv run mypy app
      - run: uv run pytest --cov=app --cov-report=term-missing --cov-fail-under=90
      - name: Contrato OpenAPI al día
        run: uv run python scripts/export_openapi.py --check
